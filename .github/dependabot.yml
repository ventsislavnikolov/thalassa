# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Updates are grouped so one run opens a handful of PRs, not one per package:
# every PR runs CI, and a long tail of them queues up without being reviewed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
